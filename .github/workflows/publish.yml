name: Publish to PyPI

# Publish claude-ctx to PyPI on every tag that looks like a version
# (v0.5.0, v0.5.0-rc1, v1.0.0, …). Uses PyPI Trusted Publishing —
# no API token needed once the pending publisher is configured at
# https://pypi.org/manage/account/publishing/.
#
# Also deployable on demand to TestPyPI via workflow_dispatch. Production
# PyPI publishes must use a version tag push so graph release assets are
# uploaded before the wheel is published.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      repository:
        description: "PyPI repository (pypi or testpypi)"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      graph_assets_available: ${{ steps.resolve_graph_assets.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Verify production tag is the exact tested main commit
        if: github.event_name == 'push'
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Do not accept an ancestor of main: production releases must be the
          # exact current main head and must have passed the canonical workflow
          # at that same immutable commit.
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse HEAD^{commit})"
          main_commit="$(git rev-parse refs/remotes/origin/main^{commit})"
          if [[ "$tag_commit" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "checked-out tag commit $tag_commit does not match workflow SHA $EXPECTED_RELEASE_SHA" >&2
            exit 1
          fi
          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "release tag commit $tag_commit is not the exact origin/main head $main_commit" >&2
            exit 1
          fi

          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs" \
            -f head_sha="$tag_commit" \
            -f branch=main \
            -f event=push \
            -f per_page=100 > tests-workflow-runs.json
          RELEASE_SHA="$tag_commit" python - <<'PY'
          import json
          import os
          from pathlib import Path

          release_sha = os.environ["RELEASE_SHA"]
          payload = json.loads(
              Path("tests-workflow-runs.json").read_text(encoding="utf-8")
          )
          exact_runs = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == release_sha
              and run.get("head_branch") == "main"
              and run.get("event") == "push"
          ]
          if not exact_runs:
              raise SystemExit(
                  f"no main-push Tests workflow run exists for release SHA {release_sha}"
              )
          latest = max(
              exact_runs,
              key=lambda run: (
                  int(run.get("run_number") or 0),
                  int(run.get("run_attempt") or 0),
                  int(run.get("id") or 0),
              ),
          )
          if latest.get("status") != "completed" or latest.get("conclusion") != "success":
              raise SystemExit(
                  "latest exact-SHA Tests workflow run is not successful: "
                  f"id={latest.get('id')} status={latest.get('status')} "
                  f"conclusion={latest.get('conclusion')}"
              )
          print(
              "release provenance verified: "
              f"sha={release_sha} tests_run_id={latest.get('id')}"
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build==1.5.0 setuptools==81.0.0 wheel==0.47.0 cyclonedx-bom==7.3.0 packaging twine

      - name: Validate release target
        run: |
          python - <<'PY'
          import os
          import tomllib
          from packaging.version import Version

          event = os.environ["GITHUB_EVENT_NAME"]
          target_repository = os.environ.get("INPUT_REPOSITORY", "pypi")
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          ref_name = os.environ["GITHUB_REF_NAME"]

          if event == "workflow_dispatch" and target_repository == "pypi":
              raise SystemExit(
                  "Manual PyPI publish is disabled; push a version tag so "
                  "graph release assets are uploaded before publishing"
              )
          if event == "workflow_dispatch" and target_repository == "testpypi":
              print(f"manual TestPyPI publish allowed from {ref_type}:{ref_name}")
              raise SystemExit(0)

          if ref_type != "tag":
              raise SystemExit(
                  "PyPI release must run from a version tag; "
                  f"got {ref_type}:{ref_name}"
              )
          tag = ref_name
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag}")

          with open("pyproject.toml", "rb") as fh:
              package_version = tomllib.load(fh)["project"]["version"]

          tag_version = str(Version(tag[1:]))
          normalized_package_version = str(Version(package_version))
          if tag_version != normalized_package_version:
              raise SystemExit(
                  f"tag {tag!r} does not match pyproject version {package_version!r}"
              )
          print(f"release version {package_version} matches tag {tag}")
          PY
        env:
          INPUT_REPOSITORY: ${{ github.event.inputs.repository || 'pypi' }}

      - name: Reject already published PyPI version
        run: |
          python - <<'PY'
          import os
          import tomllib
          import urllib.error
          import urllib.request

          target_repository = os.environ.get("INPUT_REPOSITORY", "pypi")
          if target_repository != "pypi":
              print(f"skipping PyPI reuse check for {target_repository}")
              raise SystemExit(0)

          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]

          name = project["name"]
          package_version = project["version"]
          url = f"https://pypi.org/pypi/{name}/{package_version}/json"
          try:
              with urllib.request.urlopen(url, timeout=15):
                  raise SystemExit(
                      f"{name} {package_version} already exists on PyPI; "
                      "bump the version before publishing"
                  )
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f"{name} {package_version} is not present on PyPI")
                  raise SystemExit(0)
              raise
          PY
        env:
          INPUT_REPOSITORY: ${{ github.event.inputs.repository || 'pypi' }}

      - name: Resolve release graph artifacts from exact release manifest
        id: resolve_graph_assets
        run: |
          python scripts/graph_release_manifest.py hydrate --manifest graph/release-artifacts.json

      - name: Validate release graph artifacts
        if: steps.resolve_graph_assets.outcome == 'success'
        run: |
          python src/validate_graph_artifacts.py \
            --graph-dir graph \
            --deep \
            --min-nodes 79000 \
            --min-edges 1700000 \
            --min-skills-sh-nodes 67000 \
            --min-semantic-edges 1000000 \
            --expected-nodes 79958 \
            --expected-edges 1778069 \
            --expected-semantic-edges 1088763 \
            --expected-harness-nodes 207 \
            --expected-skills-sh-nodes 67028 \
            --expected-skills-sh-catalog-entries 67024 \
            --expected-skills-sh-converted 67024 \
            --expected-skill-pages 68494 \
            --expected-agent-pages 467 \
            --expected-mcp-pages 10790 \
            --expected-harness-pages 207 \
            --line-threshold 180 \
            --max-stage-lines 40

      - name: Validate README and docs stats
        if: steps.resolve_graph_assets.outcome == 'success'
        run: python src/update_repo_stats.py --check

      - name: Static gates
        run: |
          python -m ruff check src hooks scripts
          python -m mypy src

      - name: Clean-host contract
        run: python scripts/clean_host_contract.py --fast

      - name: Release canary tests
        run: |
          python -m pytest -q --no-cov \
            src/tests/test_ci_classifier.py \
            src/tests/test_bug_smoke_tracker.py \
            src/tests/test_feature_user_story_tracker.py \
            src/tests/test_dashboard_user_story_tracker.py \
            src/tests/test_toolbox_cli.py \
            src/tests/test_package_scaffold.py \
            src/tests/test_clean_host_contract.py \
            src/tests/test_alive_loop_e2e.py

      - name: Build distributions
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          python scripts/build_reproducible_dist.py --verify --output-dir dist

      - name: Resolve exact distribution manifest
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from scripts.build_reproducible_dist import verified_artifact_paths

          artifacts = verified_artifact_paths(Path("dist"))
          wheel = next(path for path in artifacts if path.name.endswith(".whl"))
          sdist = next(path for path in artifacts if path.name.endswith(".tar.gz"))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CTX_WHEEL={wheel}\n")
              env.write(f"CTX_SDIST={sdist}\n")
          print(f"verified distribution manifest: {wheel.name}, {sdist.name}")
          PY

      - name: Check distributions
        run: python -m twine check "$CTX_WHEEL" "$CTX_SDIST"

      - name: Check distribution contents
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = Path(os.environ["CTX_WHEEL"])
          sdist = Path(os.environ["CTX_SDIST"])

          with zipfile.ZipFile(wheel) as zf:
              wheel_names = set(zf.namelist())
          required = {"ctx/config.json", "ctx/skill-registry.json"}
          missing = sorted(required - wheel_names)
          if missing:
              raise SystemExit(f"wheel missing packaged defaults: {missing}")

          with tarfile.open(sdist, "r:gz") as tf:
              names = set(tf.getnames())
          forbidden = ("/src/tests/", "/.claude/", "/.a5c/")
          leaked = sorted(name for name in names if any(part in name for part in forbidden))
          if leaked:
              raise SystemExit("sdist contains local/test artifacts:\n" + "\n".join(leaked[:20]))
          print(f"checked distribution contents: {wheel.name}, {sdist.name}")
          PY

      - name: Smoke install wheel
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "$CTX_WHEEL"
          python -m pip check
          python - <<'PY'
          import tomllib
          from importlib.metadata import entry_points, version

          import ctx
          import ctx_config

          with open("pyproject.toml", "rb") as fh:
              expected_scripts = set(tomllib.load(fh)["project"]["scripts"])

          dist_version = version("claude-ctx")
          if ctx.__version__ != dist_version:
              raise SystemExit(
                  f"ctx.__version__={ctx.__version__!r} != metadata {dist_version!r}"
              )
          if ctx_config.cfg.recommendation_top_k != 5:
              raise SystemExit("packaged default config was not loaded")
          scripts = {
              ep.name: ep for ep in entry_points(group="console_scripts")
              if ep.name == "ctx" or ep.name.startswith("ctx-")
          }
          missing = sorted(expected_scripts - set(scripts))
          extra = sorted(set(scripts) - expected_scripts)
          if missing or extra:
              raise SystemExit(
                  "wheel console-script surface mismatch\n"
                  f"missing: {missing}\n"
                  f"extra: {extra}"
              )
          failures = []
          for ep in scripts.values():
              try:
                  ep.load()
              except Exception as exc:
                  failures.append(f"{ep.name}: {exc!r}")
          if failures:
              raise SystemExit("console script load failures:\n" + "\n".join(failures))
          unsafe_help = {"ctx-mcp-server"}
          safe_help = sorted(expected_scripts - unsafe_help)
          with open("ctx-console-help.txt", "w", encoding="utf-8", newline="\n") as fh:
              fh.write("\n".join(safe_help) + "\n")
          print(
              f"loaded {len(scripts)} ctx console scripts from wheel "
              f"{dist_version}; help-smoke={len(safe_help)}"
          )
          PY
          while IFS= read -r cmd; do
            cmd="${cmd%$'\r'}"
            [[ -z "$cmd" ]] && continue
            echo "help smoke: $cmd"
            "$cmd" --help >/dev/null
          done < ctx-console-help.txt
          echo "Telemetry release smoke"
          export HOME="$PWD/.telemetry-home"
          export CTX_TELEMETRY_HASH_SALT="release-smoke-salt"
          mkdir -p "$HOME"
          python - <<'PY'
          from ctx.telemetry import record_counter, record_event

          record_event(
              "ctx.release.smoke",
              source="publish-workflow",
              payload={"query": "raw-release-telemetry-sentinel"},
          )
          record_counter(
              "ctx.release.smoke",
              attributes={"query": "raw-release-telemetry-sentinel"},
          )
          PY
          ctx-telemetry-export --dry-run --json
          ctx-telemetry-export \
            --sink local_jsonl \
            --output telemetry-events.jsonl \
            --json
          ctx-telemetry-export \
            --signal metrics \
            --sink local_jsonl \
            --output telemetry-metrics.jsonl \
            --json
          ctx-telemetry-retention plan --signal all --json
          if grep -R "raw-release-telemetry-sentinel" telemetry-events.jsonl telemetry-metrics.jsonl; then
            echo "raw telemetry sentinel leaked into exported telemetry" >&2
            exit 1
          fi

      - name: Smoke install all runtime extras
        run: |
          . .venv-smoke/bin/activate
          python -m pip install "${CTX_WHEEL}[ann,browser,embeddings,gcf,harness,viz]"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version

          expected = (
              "click",
              "gcf-python",
              "hnswlib",
              "litellm",
              "playwright",
              "plotly",
              "sentence-transformers",
              "torch",
              "typer",
          )
          for distribution in expected:
              print(f"{distribution}=={version(distribution)}")
          PY

      - name: Generate and validate CycloneDX runtime SBOM
        run: |
          mkdir -p release-sbom
          .venv-smoke/bin/python - <<'PY'
          import json
          from importlib.metadata import distributions
          from pathlib import Path

          inventory = {
              "distributions": sorted(
                  (
                      {
                          "name": dist.metadata["Name"],
                          "version": dist.version,
                          "requires": list(dist.requires or ()),
                      }
                      for dist in distributions()
                  ),
                  key=lambda item: item["name"].lower(),
              )
          }
          Path("release-sbom/resolved-environment.json").write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python -m cyclonedx_py environment \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --validate \
            --pyproject pyproject.toml \
            --mc-type application \
            --output-file release-sbom/claude-ctx.cdx.json \
            .venv-smoke/bin/python
          python -m cyclonedx_py environment \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --validate \
            --pyproject pyproject.toml \
            --mc-type application \
            --output-file release-sbom/claude-ctx.repeat.cdx.json \
            .venv-smoke/bin/python
          python scripts/validate_release_sbom.py \
            --sbom release-sbom/claude-ctx.cdx.json \
            --pyproject pyproject.toml \
            --inventory release-sbom/resolved-environment.json \
            --bind-release-identity \
            --extra ann \
            --extra browser \
            --extra embeddings \
            --extra gcf \
            --extra harness \
            --extra viz \
            --spec-version 1.6
          python scripts/validate_release_sbom.py \
            --sbom release-sbom/claude-ctx.repeat.cdx.json \
            --pyproject pyproject.toml \
            --inventory release-sbom/resolved-environment.json \
            --bind-release-identity \
            --extra ann \
            --extra browser \
            --extra embeddings \
            --extra gcf \
            --extra harness \
            --extra viz \
            --spec-version 1.6
          cmp release-sbom/claude-ctx.cdx.json release-sbom/claude-ctx.repeat.cdx.json
          rm release-sbom/claude-ctx.repeat.cdx.json
          rm release-sbom/resolved-environment.json

      - name: Revalidate exact distribution manifest
        run: python scripts/build_reproducible_dist.py --check-output dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: release-sbom/claude-ctx.cdx.json
          if-no-files-found: error

      - name: Upload graph artifact bundle
        if: steps.resolve_graph_assets.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-release-assets
          path: |
            graph/release-artifacts.json
            graph/wiki-graph.tar.gz
            graph/wiki-graph-runtime.tar.gz
            graph/skills-sh-catalog.json.gz
            graph/communities.json
            graph/entity-overlays.jsonl

  attest:
    name: Attest release artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Download release SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: release-sbom

      - name: Download graph artifact bundle
        if: needs.build.outputs.graph_assets_available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graph-release-assets
          path: graph-release-assets

      - name: Validate exact distribution manifest
        run: python scripts/build_reproducible_dist.py --check-output dist

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/packages/*.whl
            dist/packages/*.tar.gz
            release-sbom/*.json

      - name: Attest graph release provenance
        if: needs.build.outputs.graph_assets_available == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            graph-release-assets/release-artifacts.json
            graph-release-assets/wiki-graph.tar.gz
            graph-release-assets/wiki-graph-runtime.tar.gz
            graph-release-assets/skills-sh-catalog.json.gz
            graph-release-assets/communities.json
            graph-release-assets/entity-overlays.jsonl

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/packages/*.whl
            dist/packages/*.tar.gz
          sbom-path: release-sbom/claude-ctx.cdx.json

  release-assets:
    name: Upload graph and SBOM release assets
    needs:
      - build
      - attest
    if: github.event_name == 'push' && needs.build.outputs.graph_assets_available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Download graph artifact bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graph-release-assets
          path: graph-release-assets

      - name: Download release SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: release-sbom

      - name: Extract exact version notes from changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          tag = os.environ["TAG_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag}")
          version = tag[1:]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8-sig").splitlines()
          heading = re.compile(rf"^## \[{re.escape(version)}\](?: - .+)?$")
          starts = [index for index, line in enumerate(lines) if heading.fullmatch(line)]
          if len(starts) != 1:
              raise SystemExit(
                  f"expected one CHANGELOG.md section for {version}, found {len(starts)}"
              )
          start = starts[0]
          end = next(
              (
                  index
                  for index in range(start + 1, len(lines))
                  if re.fullmatch(r"## \[[^]]+\](?: - .+)?", lines[index])
              ),
              len(lines),
          )
          section = "\n".join(lines[start:end]).strip()
          body = "\n".join(lines[start + 1 : end]).strip()
          if not body:
              raise SystemExit(f"CHANGELOG.md section for {version} has no release notes")
          Path("release-notes.md").write_text(section + "\n", encoding="utf-8")
          print(f"using CHANGELOG.md section for {version} as GitHub release notes")
          PY

      - name: Upload graph assets and SBOM to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          fi
          gh release upload "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            graph-release-assets/release-artifacts.json \
            graph-release-assets/wiki-graph.tar.gz \
            graph-release-assets/wiki-graph-runtime.tar.gz \
            graph-release-assets/skills-sh-catalog.json.gz \
            graph-release-assets/communities.json \
            graph-release-assets/entity-overlays.jsonl \
            release-sbom/claude-ctx.cdx.json \
            --clobber

  publish:
    name: Publish to PyPI
    needs:
      - build
      - attest
      - release-assets
    if: ${{ always() && needs.build.result == 'success' && needs.attest.result == 'success' && (needs.release-assets.result == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.repository == 'testpypi')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Trusted Publishing
    environment:
      name: pypi
      url: https://pypi.org/project/claude-ctx/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Validate exact distribution manifest
        run: python scripts/build_reproducible_dist.py --check-output dist

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/packages/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/packages/
          repository-url: https://test.pypi.org/legacy/
