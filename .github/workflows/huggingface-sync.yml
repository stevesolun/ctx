name: Sync Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

permissions:
  contents: read

concurrency:
  group: "huggingface-sync-main"
  cancel-in-progress: true

jobs:
  sync:
    name: Sync dataset repo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          lfs: false

      - name: Require HF_TOKEN on canonical repository
        if: ${{ env.HF_TOKEN == '' && github.repository == 'stevesolun/ctx' }}
        run: |
          echo "::error title=Missing HF_TOKEN::Canonical Hugging Face sync must fail closed when the HF_TOKEN repository secret is absent."
          exit 1

      - name: Skip non-canonical repository
        if: ${{ github.repository != 'stevesolun/ctx' }}
        run: |
          echo "::notice title=Hugging Face sync skipped::Only stevesolun/ctx is trusted to publish Stevesolun/ctx."

      - name: Classify sync scope
        id: scope
        if: ${{ env.HF_TOKEN != '' && github.repository == 'stevesolun/ctx' }}
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "sync_mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="$BEFORE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse "$HEAD_SHA^")"
          fi
          git diff --name-only "$BASE" "$HEAD_SHA" > changed-files.txt
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          files = [
              line.strip().replace("\\", "/")
              for line in Path("changed-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          card_only_prefixes = ("docs/",)
          card_only_files = {"README.md", "CHANGELOG.md"}
          card_only = bool(files) and all(
              path in card_only_files or path.startswith(card_only_prefixes)
              for path in files
          )
          print(f"sync_mode={'card' if card_only else 'full'}")
          PY

      - name: Hydrate required graph artifacts from exact release manifest
        if: ${{ env.HF_TOKEN != '' && github.repository == 'stevesolun/ctx' && steps.scope.outputs.sync_mode == 'full' }}
        run: |
          python scripts/graph_release_manifest.py hydrate --manifest graph/release-artifacts.json

      - name: Set up Python
        if: ${{ env.HF_TOKEN != '' && github.repository == 'stevesolun/ctx' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install sync dependencies
        if: ${{ env.HF_TOKEN != '' && github.repository == 'stevesolun/ctx' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" huggingface_hub

      - name: Sync Hugging Face dataset repo
        if: ${{ env.HF_TOKEN != '' && github.repository == 'stevesolun/ctx' }}
        env:
          SYNC_MODE: ${{ steps.scope.outputs.sync_mode }}
        run: |
          if [[ "$SYNC_MODE" == "card" ]]; then
            python scripts/sync_huggingface.py --repo . --repo-id Stevesolun/ctx --repo-type dataset --card-only
          else
            python scripts/sync_huggingface.py --repo . --repo-id Stevesolun/ctx --repo-type dataset
          fi
