name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: "Change classifier"
    runs-on: ubuntu-latest
    outputs:
      browser_changed: ${{ steps.classify.outputs.browser_changed }}
      ci_changed: ${{ steps.classify.outputs.ci_changed }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      graph_artifact_changed: ${{ steps.classify.outputs.graph_artifact_changed }}
      graph_changed: ${{ steps.classify.outputs.graph_changed }}
      graph_only: ${{ steps.classify.outputs.graph_only }}
      package_changed: ${{ steps.classify.outputs.package_changed }}
      similarity_changed: ${{ steps.classify.outputs.similarity_changed }}
      source_changed: ${{ steps.classify.outputs.source_changed }}
      telemetry_changed: ${{ steps.classify.outputs.telemetry_changed }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            BASE="$PR_BASE_SHA"
          fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" "$HEAD_SHA" > changed-files.txt
          elif git cat-file -e "$HEAD_SHA^" 2>/dev/null; then
            git diff --name-only "$HEAD_SHA^" "$HEAD_SHA" > changed-files.txt
          else
            git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > changed-files.txt
          fi

          python scripts/ci_classifier.py changed-files.txt

  static:
    name: "Static quality gates"
    needs: classify
    if: ${{ github.event_name != 'pull_request' || (needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.graph_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run static quality gates
        run: python -m ruff format --check src hooks scripts && python -m ruff check src hooks scripts && python -m mypy src && python -m pip check

  unit-linux:
    name: "unit-linux"
    needs: classify
    if: ${{ github.event_name != 'pull_request' || (needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.graph_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          # Required by the acquisition-frozen product provenance test.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests with coverage gate
        # Bump this number as the coverage sprint ships - never lower it.
        run: pytest -q -m "not browser and not integration" --cov=src --cov-report=term-missing --cov-fail-under=40 -n auto --dist=loadfile --max-worker-restart=0

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true
          retention-days: 7

  similarity-integration:
    name: "Similarity precision/recall"
    needs: classify
    if: ${{ github.event_name != 'pull_request' || (needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.similarity_changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install embedding dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,embeddings]"

      - name: Cache MiniLM model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-sentence-transformers-all-MiniLM-L6-v2-v1

      - name: Pre-download MiniLM model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import time
          from sentence_transformers import SentenceTransformer

          model = "sentence-transformers/all-MiniLM-L6-v2"
          for attempt in range(1, 5):
              try:
                  SentenceTransformer(model)
                  print(f"ready: {model}")
                  break
              except Exception as exc:
                  print(f"attempt {attempt} failed: {exc}", flush=True)
                  if attempt == 4:
                      raise
                  time.sleep(15 * attempt)
          PY

      - name: Run similarity precision/recall gate
        env:
          CTX_REQUIRE_SIMILARITY_EVAL: "1"
        run: pytest -q --no-cov -m integration src/tests/test_similarity_precision_recall.py

  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: classify
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests without coverage
        run: pytest -q -m "not browser and not integration" --no-cov

  contract-compat:
    name: "Contract compatibility (${{ matrix.os }})"
    needs: classify
    if: ${{ github.event_name != 'pull_request' || (needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.graph_only != 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run cross-OS contract tests
        run: python -m pytest -q --no-cov src/tests/test_clean_host_contract.py src/tests/test_package_scaffold.py

  e2e-canary:
    name: "A-Z alive-loop E2E canary"
    needs: classify
    if: ${{ github.event_name != 'pull_request' || (needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.graph_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run E2E + fuzz canary suite
        # These two files pin the critical-path invariants:
        #   test_alive_loop_e2e.py: A-Z user journey (signals → bundle →
        #     install → unload → purge) — any handoff regression trips it.
        #   test_fuzz_yaml_rendering.py: property-based YAML injection
        #     coverage on install/enrich render_scalar.
        # They live in the main matrix job already, but pulling them
        # forward as a separate fail-fast canary surfaces the regression
        # in seconds instead of waiting for the full test run.
        run: |
          pytest -q --no-cov \
            src/tests/test_alive_loop_e2e.py \
            src/tests/test_fuzz_yaml_rendering.py

  docs-check:
    name: "Docs strict build"
    needs: classify
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.docs_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs and tracker test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt ".[dev]"

      - name: Run public docs tracker checks
        run: |
          python -m pytest -q --no-cov \
            src/tests/test_bug_smoke_tracker.py \
            src/tests/test_feature_user_story_tracker.py \
            src/tests/test_dashboard_user_story_tracker.py \
            src/tests/test_toolbox_cli.py

      - name: Build docs strictly
        run: |
          python -m mkdocs build --strict

  graph-check:
    name: "Graph artifact check"
    needs: classify
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.graph_artifact_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout graph artifacts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install graph check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Resolve graph artifacts from release assets or targeted LFS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Resolving graph artifacts from release cache, or targeted Git LFS for new PR pointers."
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          release_asset_wait_seconds = 300
          if os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
              release_asset_wait_seconds = 0
          release_asset_poll_seconds = 10
          expected_graph_assets = {
              "graph/wiki-graph.tar.gz": {
                  "sha256": "2ce8a945c17a7345df9d27d8f101319a9f963b0fc85d399f104630bc06a7c4a0",
                  "size": 295151086,
              },
              "graph/wiki-graph-runtime.tar.gz": {
                  "sha256": "d4a39836aab5f558b546842580b2e20c523b9a9ab901ed681f84c09b5c4d6515",
                  "size": 110283462,
              },
          }
          max_lfs_fallback_sizes = {
              "graph/wiki-graph.tar.gz": 350_000_000,
              "graph/wiki-graph-runtime.tar.gz": 150_000_000,
          }

          def load_releases() -> list[dict]:
              return json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/releases?per_page=50"],
                  text=True,
              ))

          def read_lfs_pointer(graph_tar: Path) -> tuple[str, int] | None:
              if not graph_tar.exists():
                  return None
              pointer = graph_tar.read_text(encoding="utf-8", errors="replace")
              if not pointer.startswith("version https://git-lfs.github.com/spec/v1"):
                  return None
              expected_oid = ""
              expected_size = 0
              for line in pointer.splitlines():
                  if line.startswith("oid sha256:"):
                      expected_oid = line.split(":", 1)[1].strip()
                  elif line.startswith("size "):
                      expected_size = int(line.split(" ", 1)[1].strip())
              if expected_oid and expected_size:
                  return expected_oid, expected_size
              raise SystemExit(f"{graph_tar} has incomplete Git LFS pointer metadata")

          def verify_hydrated_file(graph_tar: Path, expected_oid: str, expected_size: int) -> None:
              sha = hashlib.sha256()
              total = 0
              with graph_tar.open("rb") as fh:
                  while True:
                      chunk = fh.read(1024 * 1024)
                      if not chunk:
                          break
                      sha.update(chunk)
                      total += len(chunk)
              actual_oid = sha.hexdigest()
              if actual_oid != expected_oid or total != expected_size:
                  raise SystemExit(
                      f"{graph_tar} does not match LFS pointer: "
                      f"sha256:{actual_oid} size:{total}"
                  )

          def pointer_matches_static_release_cache(pointer: tuple[str, int], fallback: dict[str, object]) -> bool:
              return pointer == (str(fallback["sha256"]), int(fallback["size"]))

          def hydrate_from_lfs(path_name: str, expected_oid: str, expected_size: int, hydrated_min_size: int) -> None:
              graph_tar = Path(path_name)
              max_size = max_lfs_fallback_sizes.get(path_name)
              if max_size is None:
                  raise SystemExit(f"Refusing Git LFS fallback for {path_name}: no size cap configured")
              if expected_size > max_size:
                  raise SystemExit(
                      f"Refusing Git LFS fallback for {path_name}: "
                      f"pointer size {expected_size} exceeds cap {max_size}"
                  )
              print(f"Pointer for {path_name} is not in release cache; hydrating from targeted Git LFS.")
              env = os.environ.copy()
              env.setdefault("GIT_LFS_SKIP_SMUDGE", "1")
              env.setdefault("GIT_LFS_ACTIVITYTIMEOUT", "600")
              env.setdefault("GIT_LFS_DIALTIMEOUT", "120")
              env.setdefault("GIT_LFS_TLSTIMEOUT", "120")
              env.setdefault("GIT_LFS_CONCURRENTTRANSFERS", "1")
              subprocess.check_call(
                  ["git", "lfs", "pull", "--include", path_name, "--exclude", ""],
                  env=env,
              )
              if not graph_tar.exists() or graph_tar.stat().st_size <= hydrated_min_size:
                  raise SystemExit(f"Git LFS did not hydrate {path_name}")
              verify_hydrated_file(graph_tar, expected_oid, expected_size)
              print(f"Hydrated {path_name} from targeted Git LFS sha256:{expected_oid} size:{expected_size}")

          def hydrate_from_release(path_name: str, hydrated_min_size: int) -> None:
              graph_tar = Path(path_name)
              fallback = expected_graph_assets[path_name]
              expected_oid = fallback["sha256"]
              expected_size = int(fallback["size"])
              if graph_tar.exists() and graph_tar.stat().st_size > hydrated_min_size:
                  print(f"{graph_tar} is already hydrated")
                  return
              pointer = read_lfs_pointer(graph_tar)
              if pointer is not None:
                  expected_oid, expected_size = pointer
                  if not pointer_matches_static_release_cache(pointer, fallback):
                      print(
                          f"Pointer for {path_name} is newer than the static release cache; "
                          "searching release caches before targeted Git LFS."
                      )

              deadline = time.monotonic() + release_asset_wait_seconds
              while True:
                  candidates = []
                  for release in load_releases():
                      tag_name = str(release.get("tag_name") or "")
                      is_graph_cache = tag_name.startswith("graph-artifacts-")
                      if release.get("draft") or (
                          release.get("prerelease") and not is_graph_cache
                      ):
                          continue
                      for asset in release.get("assets", []):
                          if asset.get("name") != graph_tar.name:
                              continue
                          digest = str(asset.get("digest") or "")
                          size = int(asset.get("size") or 0)
                          if size != expected_size:
                              continue
                          if digest and digest != f"sha256:{expected_oid}":
                              continue
                          candidates.append((tag_name, asset))

                  if candidates:
                      break
                  if time.monotonic() >= deadline:
                      print(
                          f"No previous release asset matches {path_name} "
                          f"sha256:{expected_oid} size:{expected_size}"
                      )
                      hydrate_from_lfs(path_name, expected_oid, expected_size, hydrated_min_size)
                      return
                  print(
                      f"Waiting for matching release asset {graph_tar.name} "
                      f"sha256:{expected_oid} size:{expected_size}"
                  )
                  time.sleep(release_asset_poll_seconds)

              source_tag, asset = candidates[0]
              tmp = graph_tar.with_name(f"{graph_tar.name}.download")
              sha = hashlib.sha256()
              total = 0
              with urllib.request.urlopen(asset["browser_download_url"], timeout=300) as resp:  # noqa: S310
                  with tmp.open("wb") as fh:
                      while True:
                          chunk = resp.read(1024 * 1024)
                          if not chunk:
                              break
                          sha.update(chunk)
                          total += len(chunk)
                          fh.write(chunk)
              actual_oid = sha.hexdigest()
              if actual_oid != expected_oid or total != expected_size:
                  tmp.unlink(missing_ok=True)
                  raise SystemExit(
                      f"Downloaded {path_name} does not match LFS pointer: "
                      f"sha256:{actual_oid} size:{total}"
                  )
              tmp.replace(graph_tar)
              print(
                  f"Hydrated {path_name} from {source_tag} release asset "
                  f"sha256:{actual_oid} size:{total}"
              )

          hydrate_from_release("graph/wiki-graph.tar.gz", 100_000_000)
          hydrate_from_release("graph/wiki-graph-runtime.tar.gz", 10_000_000)
          PY

      - name: Validate shipped graph artifacts
        run: |
          python src/validate_graph_artifacts.py \
            --graph-dir graph \
            --deep \
            --min-nodes 79000 \
            --min-edges 1700000 \
            --min-skills-sh-nodes 67000 \
            --min-semantic-edges 1000000 \
            --expected-nodes 79958 \
            --expected-edges 1778069 \
            --expected-semantic-edges 1088763 \
            --expected-harness-nodes 207 \
            --expected-skills-sh-nodes 67028 \
            --expected-skills-sh-catalog-entries 67024 \
            --expected-skills-sh-converted 67024 \
            --expected-skill-pages 68494 \
            --expected-agent-pages 467 \
            --expected-mcp-pages 10790 \
            --expected-harness-pages 207 \
            --line-threshold 180 \
            --max-stage-lines 40

      - name: Validate README and docs stats
        run: python src/update_repo_stats.py --check

  browser-security:
    name: "Browser monitor security"
    needs: classify
    if: ${{ github.event_name == 'push' || needs.classify.outputs.browser_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install browser Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,browser]"

      - name: Detect Playwright version
        id: playwright
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from importlib.metadata import version

          print(f"version={version('playwright')}")
          PY

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser runtime
        run: |
          python -m playwright install-deps chromium
          python -m playwright install chromium

      - name: Run browser security tests
        run: pytest -q --no-cov -m browser src/tests/test_ctx_monitor_browser.py

  telemetry-enterprise:
    name: "Telemetry enterprise gate"
    needs: classify
    if: ${{ github.event_name == 'push' || needs.classify.outputs.telemetry_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install telemetry test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run telemetry privacy and export tests
        run: |
          python -m pytest -q --no-cov \
            src/tests/test_enterprise_telemetry.py \
            src/tests/test_harness_cli_run.py \
            -k "telemetry or runtime_lifecycle"

  package-build:
    name: "Build wheel package"
    needs: classify
    if: ${{ github.event_name != 'pull_request' || needs.classify.outputs.package_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and inspect wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.5.0 setuptools==81.0.0 wheel==0.47.0 twine
          python scripts/build_reproducible_dist.py --verify
          python scripts/build_reproducible_dist.py
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          wheel = wheels[0]
          if not wheel.name.endswith("-py3-none-any.whl"):
              message = f"expected a universal pure-Python wheel, got {wheel.name}"
              raise SystemExit(message)
          print(f"built package-smoke wheel: {wheel.name}")
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-smoke-wheel
          path: dist/*.whl
          retention-days: 7

  package-smoke:
    name: "Wheel package smoke (${{ matrix.os }})"
    needs:
      - classify
      - package-build
    if: ${{ github.event_name != 'pull_request' || needs.classify.outputs.package_changed == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-smoke-wheel
          path: dist

      - name: Install wheel in clean venv
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip check
          python - <<'PY'
          import tomllib
          from importlib.metadata import entry_points, version

          import ctx

          with open("pyproject.toml", "rb") as fh:
              expected_scripts = set(tomllib.load(fh)["project"]["scripts"])

          dist_version = version("claude-ctx")
          if ctx.__version__ != dist_version:
              raise SystemExit(
                  f"ctx.__version__={ctx.__version__!r} != metadata {dist_version!r}"
              )

          script_eps = {
              ep.name: ep
              for ep in entry_points(group="console_scripts")
              if ep.name == "ctx" or ep.name.startswith("ctx-")
          }
          missing = sorted(expected_scripts - set(script_eps))
          extra = sorted(set(script_eps) - expected_scripts)
          if missing or extra:
              raise SystemExit(
                  "wheel console-script surface mismatch\n"
                  f"missing: {missing}\n"
                  f"extra: {extra}"
              )
          failures = []
          for ep in script_eps.values():
              try:
                  ep.load()
              except Exception as exc:
                  failures.append(f"{ep.name}: {exc!r}")
          if failures:
              raise SystemExit("console script load failures:\n" + "\n".join(failures))

          unsafe_help = {"ctx-mcp-server"}
          safe_help = sorted(expected_scripts - unsafe_help)
          with open(
              "ctx-console-help.txt", "w", encoding="utf-8", newline="\n"
          ) as fh:
              fh.write("\n".join(safe_help) + "\n")
          print(
              f"loaded {len(script_eps)} ctx console scripts from wheel "
              f"{dist_version}; help-smoke={len(safe_help)}"
          )
          PY
          while IFS= read -r cmd; do
            cmd="${cmd%$'\r'}"
            [[ -z "$cmd" ]] && continue
            echo "help smoke: $cmd"
            "$cmd" --help >/dev/null
          done < ctx-console-help.txt

      - name: Product smoke on the installed wheel
        run: |
          . .venv-smoke/bin/activate
          # A repository of our own, so the checkout's size and contents
          # cannot change what the product reports.
          rm -rf smoke-repo && mkdir -p smoke-repo
          printf 'def health():\n    return "ok"\n' > smoke-repo/app.py
          printf 'def test_health():\n    assert True\n' > smoke-repo/test_app.py
          # Isolate from any ~/.claude state the runner image may carry.
          export HOME="$PWD/smoke-home"
          mkdir -p "$HOME"
          cd smoke-repo
          python - <<'PY'
          import json
          import subprocess
          import sys

          CHECKS = (
              ("bare ctx", ["ctx"], "AI agent readiness"),
              ("ctx fit", ["ctx", "fit", "."], "Repository:"),
              ("ctx doctor", ["ctx", "doctor"], "CTX Fit diagnostics"),
          )

          failures = []
          for label, argv, needle in CHECKS:
              proc = subprocess.run(argv, capture_output=True, text=True, timeout=600)
              blob = proc.stdout + proc.stderr
              if "Traceback (most recent call last)" in blob:
                  failures.append(f"{label}: raised on a clean install\n{proc.stderr[-1500:]}")
                  continue
              if needle not in proc.stdout:
                  failures.append(
                      f"{label}: exit={proc.returncode}, {needle!r} missing from stdout\n"
                      f"{proc.stdout[-1500:]}"
                  )
              else:
                  print(f"ok: {label}")

          proc = subprocess.run(
              ["ctx", "fit", ".", "--json"], capture_output=True, text=True, timeout=600
          )
          try:
              json.loads(proc.stdout)
          except json.JSONDecodeError as exc:
              failures.append(
                  f"ctx fit --json: not valid JSON on a clean install: {exc}\n"
                  f"{proc.stdout[-1500:]}\n{proc.stderr[-1500:]}"
              )
          else:
              print("ok: ctx fit --json")

          if failures:
              sys.exit("wheel product smoke failed:\n" + "\n\n".join(failures))
          PY

  clean-host-contract:
    name: "Clean host contract"
    needs: classify
    if: ${{ github.event_name != 'pull_request' || (needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.graph_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Run clean-host contract
        run: python scripts/clean_host_contract.py --fast

  no-test-no-merge:
    name: "Contract changes must touch tests"
    needs: classify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-no-test-policy.txt

      - name: Install policy parser dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r .github/requirements-no-test-policy.txt

      - name: Enforce test-coverage-per-PR policy
        # Policy: product or CI/package contract changes must include
        # at least one src/tests/ change in the same PR. Exemptions are
        # intentionally narrow and implemented in scripts/ci_no_test_policy.py:
        # release metadata-only changes, or a maintainer-applied
        # no-tests-needed label for changes where tests are genuinely not useful,
        # plus version-only dependency updates authored by Dependabot itself.
        env:
          PR_ACTOR: ${{ github.actor }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          python scripts/ci_no_test_policy.py \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA" \
            --labels-json "$PR_LABELS_JSON" \
            --actor "$PR_ACTOR"

  ci-required:
    name: "CI required"
    runs-on: ubuntu-latest
    needs:
      - classify
      - static
      - unit-linux
      - similarity-integration
      - test
      - contract-compat
      - e2e-canary
      - docs-check
      - graph-check
      - browser-security
      - package-smoke
      - package-build
      - clean-host-contract
      - no-test-no-merge
      - telemetry-enterprise
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Check required job results
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJson(needs) }}
          NO_TEST_NO_MERGE_RESULT: ${{ needs.no-test-no-merge.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$NO_TEST_NO_MERGE_RESULT" != "success" ]]; then
            echo "::error::no-test-no-merge must pass on every pull request"
            exit 1
          fi
          python scripts/ci_required.py
