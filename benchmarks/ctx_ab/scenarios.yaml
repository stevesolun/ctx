  - id: requests-json-or
    benchmark_class: trivial
    repo_url: https://github.com/psf/requests.git
    commit: f361ead047be5cb873174218582f7d8b9fcd9f49
    language: python
    query: implement and review a small Requests Response JSON fallback API with tests
    task: |
      Add `Response.json_or(default, **kwargs)`. It must return the same parsed value
      as `Response.json(**kwargs)` for valid JSON, including JSON `null`; return the
      exact `default` object only when Requests raises its public `JSONDecodeError`;
      forward decoder keyword arguments; and avoid swallowing unrelated exceptions.
    test_path: tests/test_ctx_benchmark_json_or.py
    test_body: |
      import pytest
      from requests import Response


      def response_with(body):
          response = Response()
          response.status_code = 200
          response.encoding = "utf-8"
          response._content = body
          return response


      def test_json_or_returns_valid_values_and_forwards_kwargs():
          assert response_with(b'{"value": 7}').json_or({"fallback": True}) == {"value": 7}
          assert response_with(b'{"value": 7}').json_or(None, parse_int=str) == {"value": "7"}
          assert response_with(b"null").json_or({"fallback": True}) is None
          assert response_with(b"false").json_or({"fallback": True}) is False


      def test_json_or_returns_the_exact_default_for_invalid_json():
          fallback = {"fallback": True}
          assert response_with(b"not-json").json_or(fallback) is fallback


      def test_json_or_does_not_swallow_unrelated_errors():
          class ExplodingResponse(Response):
              def json(self, **kwargs):
                  raise RuntimeError("unrelated")

          with pytest.raises(RuntimeError, match="unrelated"):
              ExplodingResponse().json_or(None)
    verify:
      - "{python}"
      - -m
      - pytest
      - -q
      - tests/test_ctx_benchmark_json_or.py
    expected_test_count: 3
    regression_verify:
      -
        - "{python}"
        - -m
        - pytest
        - -q
        - tests/test_requests.py::test_json_decode_errors_are_serializable_deserializable
    red_failure_contains: "has no attribute 'json_or'"
    allowed_changes:
      - src/requests/models.py
    reference_patch: |
      diff --git a/src/requests/models.py b/src/requests/models.py
      --- a/src/requests/models.py
      +++ b/src/requests/models.py
      @@ -1123,6 +1123,12 @@ class Response:
                   # This aliases json.JSONDecodeError and simplejson.JSONDecodeError
                   raise RequestsJSONDecodeError(e.msg, e.doc, e.pos)

      +    def json_or(self, default: Any, **kwargs: Any) -> Any:
      +        try:
      +            return self.json(**kwargs)
      +        except RequestsJSONDecodeError:
      +            return default
      +
           @property
           def links(self) -> dict[str, dict[str, str]]:
               """Returns the parsed header links of the response, if any."""
