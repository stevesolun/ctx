version: 1
scenarios:
  - id: click-echo-json
    benchmark_class: trivial
    repo_url: https://github.com/pallets/click.git
    commit: 333c28d79cd982990ee98eef61ec20ab1a4f38ba
    language: python
    query: implement and review a small public Python Click output helper with focused tests
    task: |
      Add a public `click.echo_json(value, file=None, *, sort_keys=True,
      ensure_ascii=False)` helper. It must serialize one JSON value with
      `json.dumps`, write it through Click's existing `echo` behavior, emit exactly
      one trailing newline, preserve Unicode by default, support disabling key
      sorting, and remain exported from the top-level `click` package. Do not catch
      serialization errors.
    test_path: tests/test_ctx_benchmark_echo_json.py
    test_body: |
      from io import StringIO

      import click
      import pytest


      def test_echo_json_is_public_sorted_unicode_output():
          output = StringIO()
          click.echo_json({"z": 1, "mark": "\u2713"}, file=output)
          assert output.getvalue() == '{"mark": "\u2713", "z": 1}\n'


      def test_echo_json_can_preserve_insertion_order():
          output = StringIO()
          click.echo_json({"z": 1, "a": 2}, file=output, sort_keys=False)
          assert output.getvalue() == '{"z": 1, "a": 2}\n'


      def test_echo_json_preserves_json_type_errors():
          with pytest.raises(TypeError):
              click.echo_json(object(), file=StringIO())


      def test_echo_json_can_escape_unicode_explicitly():
          output = StringIO()
          click.echo_json({"mark": "\u2713"}, file=output, ensure_ascii=True)
          assert output.getvalue() == '{"mark": "\\u2713"}\n'


      def test_echo_json_options_are_keyword_only():
          with pytest.raises(TypeError):
              click.echo_json({}, StringIO(), False)
    verify:
      - "{python}"
      - -m
      - pytest
      - -q
      - tests/test_ctx_benchmark_echo_json.py
    expected_test_count: 5
    regression_verify:
      - ["{python}", -m, pytest, -q, tests/test_utils/test_echo.py]
      - ["{python}", -m, pytest, -q, tests/test_imports.py]
    red_failure_contains: "AttributeError: echo_json"
    allowed_changes:
      - src/click/__init__.py
      - src/click/utils.py
    reference_patch: |
      diff --git a/src/click/__init__.py b/src/click/__init__.py
      --- a/src/click/__init__.py
      +++ b/src/click/__init__.py
      @@ -57,6 +57,7 @@ from .types import Tuple as Tuple
       from .types import UNPROCESSED as UNPROCESSED
       from .types import UUID as UUID
       from .utils import echo as echo
      +from .utils import echo_json as echo_json
       from .utils import format_filename as format_filename
       from .utils import get_app_dir as get_app_dir
       from .utils import open_file as open_file
      diff --git a/src/click/utils.py b/src/click/utils.py
      --- a/src/click/utils.py
      +++ b/src/click/utils.py
      @@ -346,5 +346,18 @@ def echo(
           file.flush()


      +def echo_json(
      +    value: object,
      +    file: t.IO[t.Any] | None = None,
      +    *,
      +    sort_keys: bool = True,
      +    ensure_ascii: bool = False,
      +) -> None:
      +    """Serialize one JSON value and write it through :func:`echo`."""
      +    import json
      +
      +    echo(json.dumps(value, sort_keys=sort_keys, ensure_ascii=ensure_ascii), file=file)
      +
      +
       def _get_binary_stream(name: t.Literal["stdin", "stdout", "stderr"]) -> t.BinaryIO:
           """Returns a system stream for byte processing.

