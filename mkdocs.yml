# MkDocs Material configuration for the ctx documentation site.
#
# The product is CTX Fit (`ctx fit`); the skill-router, toolbox, graph, and
# dashboard sections below document the older recommendation surface, which
# still ships and is what the published PyPI release contains.
#
# Build:    python -m mkdocs build --strict
# Serve:    python -m mkdocs serve
# Publish:  handled by .github/workflows/docs.yml on push to main.
site_name: ctx
site_description: >-
  CTX Fit finds the cheapest AI coding setup that reliably works on your
  repository and applies the winner as a reviewable change.
site_url: https://stevesolun.github.io/ctx/
repo_url: https://github.com/stevesolun/ctx
repo_name: stevesolun/ctx
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

strict: true

# SKILL.md lives in docs/ for historical reasons but doesn't belong
# in the rendered nav; the skill-router section summarizes it.
not_in_nav: |
  SKILL.md

# Workspace notes, not public documentation. `ctx-fit/` holds the M0-era
# planning and audit documents for the CTX Fit rebuild; their statuses are a
# snapshot that the shipped code has moved past, so they stay in the repository
# for contributors reading the source tree rather than being deployed as
# public claims.
exclude_docs: |
  plans/
  ctx-fit/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_javascript:
  - assets/javascripts/repo-stats-refresh.js
  - assets/javascripts/catalog.js

nav:
  - Home: index.md
  - Catalog: catalog.md
  - Knowledge graph: knowledge-graph.md
  - Hugging Face publish: huggingface-publish.md
  - Entity onboarding: entity-onboarding.md
  - Dashboard: dashboard.md
  - Telemetry: telemetry.md
  - Threat model: threat-model.md
  - Enterprise readiness: enterprise-readiness-review.md
  - Harness:
      - Attach to hosts: harness/attaching-to-hosts.md
      - LoopFlow adapter demo: harness/loopflow-adapter-demo.md
      - Clean-host contract: harness/clean-host-contract.md
  - Toolbox:
      - Overview: toolbox/index.md
      - Configuration: toolbox/configuration.md
      - Starter toolboxes: toolbox/starters.md
      - Council runner: toolbox/council-runner.md
      - Hooks & triggers: toolbox/hooks.md
      - Behavior miner: toolbox/behavior-miner.md
      - Intent interview: toolbox/intent-interview.md
      - Verdicts & guardrails: toolbox/verdicts.md
      - Backup hook install: backup-hook-install.md
  - Skill router:
      - Overview: skill-router/index.md
      - Stack signatures: stack-signatures.md
      - Skill-stack matrix: skill-stack-matrix.md
      - Marketplace registry: marketplace-registry.md
  - Health:
      - Skill health: skills-health.md
      - Memory anchoring: memory-anchor.md
      - Skill lifecycle & dashboard: skill-lifecycle-and-dashboard.md
      - Skill-quality install: skill-quality-install.md
